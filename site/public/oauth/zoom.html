<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting MeetPaw · Zoom</title>
<style>
  :root { --accent: oklch(64.6% .222 41.116); color-scheme: light; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #1a1a1a; background: #fafafa; text-align: center; }
  .card { max-width: 360px; padding: 24px; }
  .dot { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 16px;
    background: linear-gradient(160deg, oklch(70% .2 45), var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 28px; }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  p { color: #666; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="dot">🐾</div>
  <h1>Connecting to MeetPaw…</h1>
  <p id="msg">Handing you back to the app. You can close this tab.</p>
</div>
<script>
  // Forward the OAuth authorization code/state to the local MeetPaw listener.
  var q = window.location.search || "";
  if (q.indexOf("code=") !== -1 || q.indexOf("error=") !== -1) {
    window.location.replace("http://127.0.0.1:8765/" + q);
  } else {
    document.getElementById("msg").textContent =
      "No authorization code found. Please start sign-in again from MeetPaw.";
  }
</script>
</body>
</html>
